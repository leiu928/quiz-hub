<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leiu's Quiz Hub</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#ffffff;
    --bg-secondary:#f7f6f3;
    --bg-tertiary:#eeece7;
    --border:#e4e1da;
    --text:#37352f;
    --text-secondary:#787369;
    --text-faint:#a8a29a;
    --accent:#5b5bd6;
    --accent-hover:#4747c2;
    --accent-soft:#ecebfb;
    --green:#2f9e6e;
    --green-soft:#e4f5ee;
    --red:#e35d5d;
    --red-soft:#fbe9e9;
    --amber:#d9a441;
    --shadow: 0 1px 2px rgba(0,0,0,0.05), 0 4px 16px rgba(0,0,0,0.06);
    --radius:8px;
    --font-ui:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  body.dark-mode{
    --bg:#191919;
    --bg-secondary:#202020;
    --bg-tertiary:#2a2a2a;
    --border:#333333;
    --text:#e9e6e0;
    --text-secondary:#9b9691;
    --text-faint:#6b6560;
    --accent:#8585f0;
    --accent-hover:#9d9df5;
    --accent-soft:#2a2a45;
    --green:#4fbf8f;
    --green-soft:#173328;
    --red:#e88080;
    --red-soft:#3a2323;
    --amber:#e0b662;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 20px rgba(0,0,0,0.4);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:var(--font-ui); background:var(--bg); color:var(--text);
    height:100vh; overflow:hidden; -webkit-font-smoothing:antialiased;
    color-scheme: light;
  }
  body.dark-mode{ color-scheme: dark; }
  /* Dark-mode transition is scoped to top-level chrome and bounded-count UI only —
     applying it to every table cell/pill/badge (unbounded count) caused visible
     jank when toggling on a subject with a large question bank. */
  body, .topbar, .sidebar, .modal, .quiz-overlay, .quiz-stimulus, .quiz-option,
  .icon-btn, .btn, .search, .select-input, .text-input,
  .field textarea, .field input, .tagselect, .bottom-sheet, .tagdrop-panel{
    transition: background-color .15s ease, color .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes fadeScaleIn{ from{opacity:0; transform:translateY(6px) scale(.98);} to{opacity:1; transform:translateY(0) scale(1);} }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  button{font-family:inherit; cursor:pointer;}
  input, select, textarea{font-family:inherit; color:inherit;}
  ::selection{background:var(--accent-soft);}

  /* ---- Layout ---- */
  .app{display:flex; flex-direction:column; height:100vh;}
  .topbar{
    display:flex; align-items:center; gap:16px; padding:0 clamp(10px,3vw,18px); height:52px; flex-shrink:0;
    border-bottom:1px solid var(--border); background:var(--bg);
  }
  .topbar .logo{display:flex; align-items:center; gap:8px; font-weight:700; font-size:15px; letter-spacing:-.2px;}
  .topbar .logo i{color:var(--accent);}
  .topbar .search{
    flex:1; max-width:420px; margin:0 auto; display:flex; align-items:center; gap:8px;
    background:var(--bg-secondary); border:1px solid var(--border); border-radius:6px; padding:6px 10px;
  }
  .topbar .search input{border:none; outline:none; background:transparent; width:100%; font-size:13px; color:var(--text);}
  .topbar .search i{color:var(--text-faint); font-size:12px;}
  .topbar-actions{display:flex; align-items:center; gap:4px;}
  .icon-btn{
    position:relative; display:flex; align-items:center; justify-content:center; gap:6px; width:34px; height:34px; border-radius:6px;
    border:none; background:transparent; color:var(--text-secondary); font-size:14px; transition:background .12s;
  }
  .icon-btn:hover{background:var(--bg-tertiary); color:var(--text);}
  .icon-btn.wide{width:auto; padding:0 12px; font-size:13px; font-weight:500;}
  .icon-btn.primary{background:var(--accent); color:#fff;}
  .icon-btn.primary:hover{background:var(--accent-hover);}

  .sync-dot{
    position:absolute; top:6px; right:6px; width:7px; height:7px; border-radius:50%; border:1.5px solid var(--bg);
    background:var(--text-faint);
  }
  .sync-dot.offline{background:var(--text-faint);}
  .sync-dot.signed-out{background:var(--amber);}
  .sync-dot.syncing{background:var(--accent); animation:pulseDot 1s ease-in-out infinite;}
  .sync-dot.synced{background:var(--green);}
  .sync-dot.error{background:var(--red);}
  @keyframes pulseDot{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

  .sync-status-row{display:flex; align-items:center; gap:10px; padding:12px; background:var(--bg-secondary); border-radius:8px; margin-bottom:16px;}
  .sync-status-row .dot-lg{width:10px; height:10px; border-radius:50%; flex-shrink:0;}
  .sync-status-row .dot-lg.offline{background:var(--text-faint);}
  .sync-status-row .dot-lg.signed-out{background:var(--amber);}
  .sync-status-row .dot-lg.syncing{background:var(--accent);}
  .sync-status-row .dot-lg.synced{background:var(--green);}
  .sync-status-row .dot-lg.error{background:var(--red);}
  .sync-tabs{display:flex; gap:6px; margin-bottom:4px;}
  .sync-tabs button{flex:1; padding:7px; border-radius:6px; border:1px solid var(--border); background:var(--bg); font-size:12.5px; font-weight:600; color:var(--text-secondary);}
  .sync-tabs button.active{background:var(--accent-soft); color:var(--accent); border-color:var(--accent);}

  .body-row{flex:1; display:flex; min-height:0;}
  .sidebar{
    width:220px; flex-shrink:0; border-right:1px solid var(--border); background:var(--bg-secondary);
    display:flex; flex-direction:column; padding:10px 8px;
  }
  .sidebar-title{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); padding:8px 8px 4px;}
  .subject-list{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:1px;}
  .subject-item{
    display:flex; align-items:center; justify-content:space-between; gap:6px; padding:7px 8px; border-radius:6px;
    font-size:13.5px; color:var(--text-secondary); cursor:pointer;
  }
  .subject-item span.name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .subject-item:hover{background:var(--bg-tertiary);}
  .subject-item.active{background:var(--accent-soft); color:var(--accent); font-weight:600;}
  .subject-item .del{opacity:0; font-size:11px; color:var(--text-faint);}
  .subject-item:hover .del{opacity:1;}
  .subject-item .del:hover{color:var(--red);}
  .add-subject-btn{
    display:flex; align-items:center; gap:8px; padding:8px; border-radius:6px; border:none; background:transparent;
    color:var(--text-faint); font-size:13px; margin-top:4px;
  }
  .add-subject-btn:hover{background:var(--bg-tertiary); color:var(--text-secondary);}

  .main{flex:1; overflow-y:auto; overflow-x:hidden; padding:24px clamp(14px,4vw,32px); min-width:0;}
  .table-scroll{width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch;}
  .sidebar-toggle{display:none; flex-shrink:0;}
  .sidebar-backdrop{display:none;}
  .empty-state{display:flex; flex-direction:column; align-items:center; justify-content:center; height:70%; color:var(--text-faint); gap:10px; text-align:center;}
  .empty-state i{font-size:32px; color:var(--text-faint);}

  .subject-header{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:6px; flex-wrap:wrap; gap:10px;}
  .subject-header h1{font-size:22px; margin:0; font-weight:700; letter-spacing:-.3px;}
  .subject-meta{color:var(--text-faint); font-size:12.5px; margin-bottom:18px;}
  .tabs{display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:16px;}
  .tab-btn{padding:8px 4px; margin-right:18px; background:none; border:none; font-size:13.5px; color:var(--text-faint); border-bottom:2px solid transparent; font-weight:500;}
  .tab-btn.active{color:var(--text); border-bottom-color:var(--accent);}

  .toolbar{display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
  .select-input, .text-input{
    padding:6px 10px; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:13px;
  }
  .btn{
    padding:7px 14px; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--text);
    font-size:13px; font-weight:500; display:inline-flex; align-items:center; gap:6px;
  }
  .btn:hover{background:var(--bg-tertiary);}
  .btn.danger{color:var(--red); border-color:var(--red-soft);}
  .btn.danger:hover{background:var(--red-soft);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn.primary:hover{background:var(--accent-hover);}
  .btn.ghost{border-color:transparent; background:transparent;}
  .btn.ghost:hover{background:var(--bg-tertiary);}

  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  thead th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-faint);
    font-weight:600; padding:8px 10px; border-bottom:1px solid var(--border);
  }
  tbody td{padding:10px; border-bottom:1px solid var(--border); vertical-align:top;}
  tbody tr:hover{background:var(--bg-secondary);}
  .qprev{max-width:420px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .pill{display:inline-block; padding:2px 8px; border-radius:100px; background:var(--accent-soft); color:var(--accent); font-size:11px; margin:0 4px 4px 0; font-weight:500;}
  .type-badge{font-size:11px; padding:2px 7px; border-radius:5px; font-weight:600;}
  .type-badge.single{background:var(--bg-tertiary); color:var(--text-secondary);}
  .type-badge.group{background:var(--accent-soft); color:var(--accent);}
  button.type-badge{border:none; cursor:pointer; font-family:inherit;}
  button.type-badge.group:hover{background:var(--accent); color:#fff;}
  .row-actions{display:flex; gap:4px;}
  .row-actions button{border:none; background:transparent; color:var(--text-faint); width:26px; height:26px; border-radius:5px;}
  .row-actions button:hover{background:var(--bg-tertiary); color:var(--text);}
  .row-actions button.del-action:hover{color:var(--red);}
  .pct-good{color:var(--green); font-weight:600;}
  .pct-bad{color:var(--red); font-weight:600;}
  .pct-mid{color:var(--amber); font-weight:600;}

  /* ---- Stats: overview strip ---- */
  .stat-strip{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:20px;}
  .stat-card{
    flex:1; min-width:130px; background:var(--bg-secondary); border:1px solid var(--border); border-radius:10px;
    padding:14px 16px;
  }
  .stat-card .stat-value{font-size:24px; font-weight:800; letter-spacing:-.4px; line-height:1.2;}
  .stat-card .stat-label{font-size:11.5px; color:var(--text-faint); margin-top:2px; font-weight:500;}

  /* ---- Stats: mastery breakdown ---- */
  .stats-section-title{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--text-faint); margin:0 0 10px;}
  .mastery-block{margin-bottom:22px;}
  .mastery-bar{display:flex; height:14px; border-radius:100px; overflow:hidden; background:var(--bg-tertiary); margin-bottom:10px;}
  .mastery-seg{height:100%; transition:width .3s ease;}
  .mastery-seg.notstarted{background:var(--text-faint);}
  .mastery-seg.needswork{background:var(--red);}
  .mastery-seg.gettingthere{background:var(--amber);}
  .mastery-seg.mastered{background:var(--green);}
  .mastery-legend{display:flex; gap:18px; flex-wrap:wrap; font-size:12.5px; color:var(--text-secondary);}
  .mastery-legend .dot{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; vertical-align:middle;}
  .mastery-legend .dot.notstarted{background:var(--text-faint);}
  .mastery-legend .dot.needswork{background:var(--red);}
  .mastery-legend .dot.gettingthere{background:var(--amber);}
  .mastery-legend .dot.mastered{background:var(--green);}

  /* ---- Stats: sortable table headers ---- */
  th.sortable{cursor:pointer; user-select:none;}
  th.sortable:hover{color:var(--text);}
  th.sortable .sort-arrow{margin-left:4px; opacity:.5; font-size:9px;}
  th.sortable.active .sort-arrow{opacity:1; color:var(--accent);}

  /* ---- Modal ---- */
  .overlay{
    position:fixed; inset:0; background:rgba(20,18,14,0.45); display:flex; align-items:center; justify-content:center;
    z-index:100; padding:20px; animation:fadeIn .18s ease;
  }
  .modal{
    background:var(--bg); border-radius:12px; width:100%; max-width:560px; max-height:88vh; overflow-y:auto;
    box-shadow:var(--shadow); border:1px solid var(--border); animation:fadeScaleIn .2s ease;
  }
  .modal.wide{max-width:760px;}
  .modal-head{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); z-index:2;}
  .modal-head h3{margin:0; font-size:15px; font-weight:700;}
  .modal-head button{border:none; background:transparent; color:var(--text-faint); font-size:16px; width:28px; height:28px; border-radius:6px;}
  .modal-head button:hover{background:var(--bg-tertiary);}
  .modal-body{padding:18px 20px;}
  .modal-foot{display:flex; justify-content:flex-end; gap:8px; padding:14px 20px; border-top:1px solid var(--border); position:sticky; bottom:0; background:var(--bg);}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--text-secondary); margin-bottom:5px;}
  .field textarea, .field input[type=text], .field input[type=number], .field input[type=email], .field input[type=password]{
    width:100%; padding:8px 10px; border-radius:6px; border:1px solid var(--border); background:var(--bg); font-size:13.5px; resize:vertical;
  }
  .field textarea{min-height:64px;}
  .option-row{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
  .option-row input[type=radio]{accent-color:var(--accent); flex-shrink:0;}
  .option-row input[type=text]{flex:1;}
  .option-row .rm-opt{border:none; background:transparent; color:var(--text-faint); width:26px; height:26px; border-radius:5px; flex-shrink:0;}
  .option-row .rm-opt:hover{color:var(--red); background:var(--red-soft);}
  .hint{font-size:11.5px; color:var(--text-faint); margin-top:4px;}
  .radio-row{display:flex; gap:16px; align-items:center; flex-wrap:wrap;}
  .radio-row label{display:flex; align-items:center; gap:6px; font-size:13px; font-weight:500; color:var(--text);}

  .tagselect{display:flex; flex-wrap:wrap; gap:6px; padding:8px; border:1px solid var(--border); border-radius:6px; max-height:120px; overflow-y:auto;}
  .tagselect label{display:flex; align-items:center; gap:5px; font-size:12.5px; background:var(--bg-secondary); padding:3px 8px; border-radius:100px;}
  .tagselect input{accent-color:var(--accent);}

  /* ---- Tag dropdown (checkbox multiselect) ---- */
  .tagdrop{position:relative;}
  .tagdrop-btn{
    width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 10px;
    border-radius:6px; border:1px solid var(--border); background:var(--bg); font-size:13px; color:var(--text); text-align:left;
  }
  .tagdrop-btn:hover{border-color:var(--accent);}
  .tagdrop-btn .preview{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text-secondary);}
  .tagdrop-btn .preview.has-selection{color:var(--text); font-weight:500;}
  .tagdrop-panel{
    position:absolute; top:calc(100% + 6px); left:0; right:0; background:var(--bg); border:1px solid var(--border);
    border-radius:8px; box-shadow:var(--shadow); padding:8px; z-index:20;
    animation:fadeScaleIn .15s ease; display:flex; flex-direction:column; gap:6px;
  }
  .tagdrop-panel label{display:flex; align-items:center; gap:8px; font-size:13px; padding:6px 6px; border-radius:5px;}
  .tagdrop-panel label:hover{background:var(--bg-secondary);}
  .tagdrop-panel input{accent-color:var(--accent);}
  .tagdrop-search{
    width:100%; padding:7px 9px; border-radius:6px; border:1px solid var(--border); background:var(--bg-secondary);
    font-size:12.5px; color:var(--text);
  }
  .tagdrop-search:focus{outline:none; border-color:var(--accent);}
  .tagdrop-list{max-height:180px; overflow-y:auto;}

  /* ---- Toast ---- */
  .toast-wrap{position:fixed; bottom:20px; right:20px; display:flex; flex-direction:column; gap:8px; z-index:300;}
  .toast{
    background:var(--text); color:var(--bg); padding:10px 16px; border-radius:8px; font-size:13px; box-shadow:var(--shadow);
    max-width:340px; animation:slideup .18s ease;
  }
  .toast.error{background:var(--red);}
  .toast.success{background:var(--green);}
  @keyframes slideup{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

  /* ---- Quiz Overlay ---- */
  .quiz-overlay{position:fixed; inset:0; background:var(--bg); z-index:200; display:flex; flex-direction:column; animation:fadeIn .2s ease;}
  .quiz-top{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
    padding:14px clamp(16px,5vw,24px); border-bottom:1px solid var(--border); flex-shrink:0;
  }
  .quiz-progress{font-size:13px; font-weight:600; color:var(--text-secondary);}
  .quiz-progress-bar{height:4px; background:var(--bg-tertiary); border-radius:2px; overflow:hidden; width:200px; max-width:40vw; margin-top:6px;}
  .quiz-progress-bar-fill{height:100%; background:var(--accent); transition:width .2s;}
  .quiz-content{
    flex:1; overflow-y:auto; overflow-x:hidden; display:flex; justify-content:center; align-items:center;
    padding:36px clamp(16px,5vw,24px); box-sizing:border-box;
  }
  .quiz-inner{width:100%; max-width:760px; margin:auto; box-sizing:border-box;}
  .quiz-split{display:flex; gap:28px; max-width:960px; width:100%; align-items:center; margin:auto; box-sizing:border-box;}
  .quiz-fade{animation:fadeUp .15s ease;}
  .quiz-stimulus{
    flex:0 0 38%; min-width:0; background:var(--bg-secondary); border-radius:10px; padding:20px; font-size:14px; line-height:1.65;
    border:1px solid var(--border); max-height:60vh; overflow-y:auto; overflow-x:auto; align-self:center; box-sizing:border-box;
  }
  .quiz-qside{flex:1; min-width:0; align-self:center;}
  .quiz-question{font-size:17px; font-weight:600; line-height:1.5; margin-bottom:20px; overflow-wrap:break-word;}
  @media (max-width: 680px){
    .quiz-split{flex-direction:column; align-items:stretch; gap:18px;}
    .quiz-stimulus{flex:0 0 auto; width:100%; max-height:32vh;}
  }
  code{
    font-family:var(--font-mono); font-size:.9em; background:var(--bg-tertiary); color:var(--text);
    padding:1px 5px; border-radius:4px; border:1px solid var(--border);
  }
  pre{
    font-family:var(--font-mono); font-size:12.5px; background:var(--bg-tertiary); border:1px solid var(--border);
    border-radius:8px; padding:12px 14px; overflow-x:auto; margin:10px 0; line-height:1.55;
  }
  pre code{background:none; border:none; padding:0; font-size:inherit;}
  /* KaTeX doesn't set its own text color, but be explicit so rendered math always
     tracks the theme instead of any browser/user-agent default. */
  .katex{color:inherit;}
  .rq-stimulus pre, .rq-stimulus code, .quiz-stimulus pre, .quiz-stimulus code{font-size:12px;}
  .quiz-option{
    display:flex; align-items:flex-start; gap:10px; padding:12px 14px; border:1px solid var(--border); border-radius:8px;
    margin-bottom:8px; font-size:14px; line-height:1.5; transition:border-color .12s, background .12s; overflow-wrap:break-word;
  }
  .quiz-option:hover{border-color:var(--accent);}
  .quiz-option.selected{border-color:var(--accent); background:var(--accent-soft);}
  .quiz-option.correct{border-color:var(--green); background:var(--green-soft);}
  .quiz-option.incorrect{border-color:var(--red); background:var(--red-soft);}
  .quiz-option .marker{
    width:18px; height:18px; border-radius:50%; border:2px solid var(--border); flex-shrink:0; margin-top:1px;
  }
  .quiz-option.selected .marker{border-color:var(--accent); background:var(--accent);}
  .quiz-option.correct .marker{border-color:var(--green); background:var(--green);}
  .quiz-option.incorrect .marker{border-color:var(--red); background:var(--red);}
  .quiz-option .opt-key{
    margin-left:auto; flex-shrink:0; font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint);
    border:1px solid var(--border); border-radius:4px; padding:1px 6px; align-self:center;
  }
  .quiz-actions{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-top:22px;}
  .key-hint{
    font-family:var(--font-mono); font-size:10px; opacity:.75; margin-left:6px; padding:1px 5px; border:1px solid currentColor; border-radius:3px;
  }
  .quiz-feedback{font-size:13px; font-weight:600; margin-top:14px; animation:fadeIn .2s ease;}
  .quiz-feedback.correct{color:var(--green);}
  .quiz-feedback.incorrect{color:var(--red);}

  .end-screen{display:flex; flex-direction:column; align-items:center; text-align:center; gap:14px; padding-top:40px; animation:fadeUp .22s ease;}
  .end-score{font-size:48px; font-weight:800; color:var(--accent);}
  .review-list{width:100%; max-width:720px; margin:0 auto; text-align:left; display:flex; flex-direction:column; gap:14px;}
  .review-item{border:1px solid var(--border); border-radius:10px; padding:16px 18px; animation:fadeUp .18s ease;}
  .review-item .rq-stimulus{background:var(--bg-secondary); border-radius:8px; padding:10px 12px; font-size:13px; margin-bottom:10px; color:var(--text-secondary);}
  .review-item .rq-text{font-weight:600; font-size:14.5px; margin-bottom:10px; line-height:1.5;}
  .review-item .rq-ans{font-size:13px; margin-bottom:4px; line-height:1.5;}
  .review-item .rq-ans .lbl{color:var(--text-faint); font-weight:600; margin-right:4px;}
  .review-item .rq-ans.wrong{color:var(--red);}
  .review-item .rq-ans.right{color:var(--green);}

  /* ---- Bottom sheet ---- */
  .bottom-sheet{
    position:fixed; left:50%; transform:translateX(-50%); bottom:20px; background:var(--text); color:var(--bg);
    padding:14px 18px; border-radius:10px; display:flex; align-items:center; gap:16px; box-shadow:var(--shadow); z-index:250;
    animation:slideup .2s ease;
  }
  .bottom-sheet button{border:none; padding:7px 14px; border-radius:6px; font-size:12.5px; font-weight:600;}
  .bottom-sheet .resume-btn{background:var(--accent); color:#fff;}
  .bottom-sheet .discard-btn{background:transparent; color:var(--bg); opacity:.7;}

  ::-webkit-scrollbar{width:9px; height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:5px;}
  ::-webkit-scrollbar-track{background:transparent;}

  /* ---- More menu (mobile topbar overflow) ---- */
  #btnMore{display:none;}
  #moreMenuWrap .tagdrop-panel{right:0; left:auto; min-width:190px; padding:6px;}
  #moreMenuWrap .tagdrop-panel button{
    display:flex; align-items:center; gap:10px; width:100%; padding:9px 10px; border:none; background:transparent;
    border-radius:6px; font-size:13px; color:var(--text); text-align:left;
  }
  #moreMenuWrap .tagdrop-panel button:hover{background:var(--bg-secondary);}
  #moreMenuWrap .tagdrop-panel button i{width:16px; color:var(--text-faint);}

  /* ---- Responsive: phone & tablet widths ---- */
  @media (max-width: 860px){
    .sidebar-toggle{display:flex;}
    .logo span.logo-text{display:none;}
    .foldable{display:none;}
    #btnMore{display:flex;}
    .icon-btn.wide{padding:0 10px;}
    .icon-btn.wide span.btn-label{display:none;}

    .sidebar{
      position:fixed; top:52px; left:0; bottom:0; width:260px; max-width:78vw; z-index:150;
      transform:translateX(-100%); transition:transform .22s ease; box-shadow:var(--shadow);
    }
    .sidebar.open{transform:translateX(0);}
    .sidebar-backdrop{
      display:block; position:fixed; inset:52px 0 0 0; background:rgba(15,13,10,0.4); z-index:140;
      opacity:0; pointer-events:none; transition:opacity .2s ease;
    }
    .sidebar-backdrop.show{opacity:1; pointer-events:auto;}

    .icon-btn{width:38px; height:38px;}
    table{font-size:12.5px;}
    .qprev{max-width:180px;}

    /* iOS Safari auto-zooms the viewport when focusing any input/textarea under
       16px font-size — disorienting inside a modal and a common cause of forms
       (like sign-in) feeling broken or mis-tappable on phones. */
    .field textarea, .field input[type=text], .field input[type=number],
    .field input[type=email], .field input[type=password], .select-input, .text-input,
    .topbar .search input{
      font-size:16px;
    }
  }
  @media (min-width: 861px){
    #sidebarBackdrop{display:none !important;}
  }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <button class="icon-btn sidebar-toggle" id="btnSidebarToggle" title="Courses"><i class="fa-solid fa-bars"></i></button>
    <div class="logo"><i class="fa-solid fa-layer-group"></i> <span class="logo-text">Leiu's Quiz Hub</span></div>
    <div class="search"><i class="fa-solid fa-magnifying-glass"></i><input id="searchInput" placeholder="Search questions..."></div>
    <div class="topbar-actions">
      <button class="icon-btn foldable" id="btnInfo" title="About this app"><i class="fa-solid fa-circle-info"></i></button>
      <button class="icon-btn foldable" id="btnImport" title="Import"><i class="fa-solid fa-file-import"></i></button>
      <button class="icon-btn foldable" id="btnExport" title="Export Quiz Pack"><i class="fa-solid fa-file-export"></i></button>
      <button class="icon-btn foldable" id="btnImportBackup" title="Import Quiz Pack"><i class="fa-solid fa-upload"></i></button>
      <button class="icon-btn wide primary" id="btnGenerate" title="Generate Quiz"><i class="fa-solid fa-rocket"></i> <span class="btn-label">Generate Quiz</span></button>
      <button class="icon-btn foldable" id="btnShortcuts" title="Keyboard shortcuts"><i class="fa-solid fa-keyboard"></i></button>
      <button class="icon-btn" id="btnSync" title="Cloud sync"><i class="fa-solid fa-cloud"></i><span class="sync-dot offline"></span></button>
      <button class="icon-btn foldable" id="btnDark" title="Toggle dark mode"><i class="fa-solid fa-moon"></i></button>
      <div class="tagdrop" id="moreMenuWrap">
        <button class="icon-btn" id="btnMore" title="More"><i class="fa-solid fa-ellipsis-vertical"></i></button>
      </div>
    </div>
  </div>

  <div class="body-row">
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <div class="sidebar" id="sidebarEl">
      <div class="sidebar-title">Subjects</div>
      <div class="subject-list" id="subjectList"></div>
      <button class="add-subject-btn" id="btnAddSubject"><i class="fa-solid fa-plus"></i> Add Subject</button>
    </div>
    <div class="main" id="mainArea"></div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>
<div id="modalRoot"></div>
<div id="sheetRoot"></div>
<input type="file" id="backupFileInput" accept=".json" style="display:none">

<script>
/* ============================= STATE ============================= */
const STORAGE_KEY = 'quizHubData';
const SESSION_KEY = 'ongoingQuiz';
const ACTIVE_SUBJECT_KEY = 'quizHubActiveSubject';
let state = loadState();
let activeSubjectId = restoreActiveSubjectId();
let activeTab = 'bank'; // 'bank' | 'stats'
let bankTagFilter = new Set();
let searchQuery = '';

function restoreActiveSubjectId(){
  const saved = localStorage.getItem(ACTIVE_SUBJECT_KEY);
  if(saved && state.subjects[saved]) return saved;
  return Object.keys(state.subjects)[0] || null;
}
function setActiveSubject(id){
  activeSubjectId = id;
  if(id) localStorage.setItem(ACTIVE_SUBJECT_KEY, id);
  else localStorage.removeItem(ACTIVE_SUBJECT_KEY);
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ console.error('Failed to load state', e); }
  return { subjects: {}, version: '1.0' };
}
function saveState(){
  try{
    const json = JSON.stringify(state);
    const sizeMB = new Blob([json]).size / (1024*1024);
    if(sizeMB > 4){ toast('Warning: data size is ' + sizeMB.toFixed(1) + 'MB, approaching localStorage limits.', 'error'); }
    localStorage.setItem(STORAGE_KEY, json);
  }catch(e){
    toast('Failed to save data: ' + e.message, 'error');
  }
  scheduleCloudPush();
}
function uid(prefix){ return prefix + '-' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function touchSubject(subjectId){
  const s = state.subjects[subjectId];
  if(s) s.updatedAt = new Date().toISOString();
}

/* ============================= TOAST ============================= */
function toast(msg, type=''){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast' + (type?(' '+type):'');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 3600);
}

/* ============================= DARK MODE ============================= */
function initDarkMode(){
  const pref = localStorage.getItem('quizHubDarkMode');
  if(pref === 'true') document.body.classList.add('dark-mode');
  updateDarkIcon();
}
function toggleDarkMode(){
  document.body.classList.toggle('dark-mode');
  localStorage.setItem('quizHubDarkMode', document.body.classList.contains('dark-mode'));
  updateDarkIcon();
}
function updateDarkIcon(){
  const icon = document.querySelector('#btnDark i');
  icon.className = document.body.classList.contains('dark-mode') ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
}

/* ============================= KATEX RENDER ============================= */
function renderMath(container){
  if(window.renderMathInElement){
    try{
      renderMathInElement(container, {
        delimiters: [
          {left:'\\[', right:'\\]', display:true},
          {left:'\\(', right:'\\)', display:false}
        ],
        throwOnError:false
      });
    }catch(e){}
  }
}

/* ============================= SIDEBAR ============================= */
function renderSidebar(){
  const list = document.getElementById('subjectList');
  const subjects = Object.values(state.subjects);
  if(subjects.length === 0){
    list.innerHTML = '<div style="padding:10px 8px; font-size:12.5px; color:var(--text-faint);">No subjects yet</div>';
    return;
  }
  list.innerHTML = subjects.map(s => `
    <div class="subject-item ${s.id===activeSubjectId?'active':''}" data-id="${s.id}">
      <span class="name">${escapeHtml(s.name)}</span>
      <i class="fa-solid fa-trash del" data-del="${s.id}"></i>
    </div>
  `).join('');
  list.querySelectorAll('.subject-item').forEach(el=>{
    el.addEventListener('click', (e)=>{
      if(e.target.dataset.del) return;
      setActiveSubject(el.dataset.id);
      bankTagFilter = new Set();
      searchQuery = '';
      document.getElementById('searchInput').value = '';
      activeTab = 'bank';
      renderAll();
      closeSidebarDrawer();
    });
  });
  list.querySelectorAll('[data-del]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      confirmModal(`Delete "${state.subjects[el.dataset.del].name}" and all its questions? This cannot be undone.`, ()=>{
        delete state.subjects[el.dataset.del];
        if(activeSubjectId === el.dataset.del){
          setActiveSubject(Object.keys(state.subjects)[0] || null);
        }
        saveState(); renderAll();
      });
    });
  });
}

/* ============================= MAIN AREA ============================= */
function renderAll(){
  renderSidebar();
  renderMain();
}
function renderMain(){
  const main = document.getElementById('mainArea');
  const subject = activeSubjectId ? state.subjects[activeSubjectId] : null;
  if(!subject){
    main.innerHTML = `<div class="empty-state"><i class="fa-solid fa-inbox"></i><div>No subject selected.<br>Add a subject to get started.</div></div>`;
    return;
  }
  const allTags = getAllTags(subject);
  main.innerHTML = `
    <div class="subject-header">
      <h1>${escapeHtml(subject.name)}</h1>
    </div>
    <div class="subject-meta">${subject.questions.length} question${subject.questions.length!==1?'s':''}</div>
    <div class="tabs">
      <button class="tab-btn ${activeTab==='bank'?'active':''}" data-tab="bank">Bank</button>
      <button class="tab-btn ${activeTab==='stats'?'active':''}" data-tab="stats">Statistics</button>
    </div>
    <div id="tabContent"></div>
  `;
  main.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click', ()=>{
    activeTab = b.dataset.tab; renderMain();
  }));
  if(activeTab === 'bank') renderBankTab(subject, allTags);
  else renderStatsTab(subject);
}

function getAllTags(subject){
  const set = new Set();
  subject.questions.forEach(q => (q.tags||[]).forEach(t=>set.add(t)));
  return Array.from(set).sort();
}

function filteredQuestions(subject){
  return subject.questions.filter(q=>{
    if(bankTagFilter.size>0){
      const hasAll = Array.from(bankTagFilter).every(t=>(q.tags||[]).includes(t));
      if(!hasAll) return false;
    }
    if(searchQuery){
      const hay = (q.questionText + ' ' + (q.parentStimulus||'')).toLowerCase();
      if(!hay.includes(searchQuery.toLowerCase())) return false;
    }
    return true;
  });
}

function renderBankTab(subject, allTags){
  const content = document.getElementById('tabContent');
  const qs = filteredQuestions(subject);
  const groupIndexMap = {};
  subject.groups.forEach((g,i)=>{ groupIndexMap[g.id] = i+1; });
  content.innerHTML = `
    <div class="toolbar">
      <button class="btn" id="tagFilterBtn"><i class="fa-solid fa-tag"></i> Filter tags ${bankTagFilter.size?`(${bankTagFilter.size})`:''}</button>
      <div id="tagFilterPanel" style="display:none;"></div>
    </div>
    ${qs.length===0 ? `<div class="empty-state" style="height:200px;"><i class="fa-solid fa-circle-question"></i><div>No questions match. Try importing questions or adjusting filters.</div></div>` : `
    <div class="table-scroll">
    <table>
      <thead><tr><th style="width:36px;">#</th><th>Question</th><th style="width:200px;">Tags</th><th style="width:110px;">Type</th><th style="width:100px;">Actions</th></tr></thead>
      <tbody>
        ${qs.map((q,i)=>{
          let typeCell;
          if(q.type==='single'){
            typeCell = `<span class="type-badge single">Single</span>`;
          } else {
            const group = subject.groups.find(g=>g.id===q.groupId);
            const gNum = groupIndexMap[q.groupId] || '?';
            const pos = group ? group.childQuestionIds.indexOf(q.id)+1 : '?';
            const of = group ? group.childQuestionIds.length : '?';
            typeCell = `<button class="type-badge group group-preview-btn" data-preview-group="${q.groupId}" title="Preview all questions in this group">Group ${gNum} <span style="opacity:.7;">· ${pos}/${of}</span></button>`;
          }
          return `
          <tr>
            <td>${i+1}</td>
            <td class="qprev">${escapeHtml(truncate(q.questionText,90))}</td>
            <td>${(q.tags||[]).map(t=>`<span class="pill">${escapeHtml(t)}</span>`).join('')}</td>
            <td>${typeCell}</td>
            <td><div class="row-actions">
              <button data-edit="${q.id}" title="Edit"><i class="fa-solid fa-pen"></i></button>
              <button data-del="${q.id}" class="del-action" title="Delete"><i class="fa-solid fa-trash"></i></button>
            </div></td>
          </tr>
        `;}).join('')}
      </tbody>
    </table>
    </div>`}
  `;
  const panel = content.querySelector('#tagFilterPanel');
  panel.innerHTML = `<div class="tagselect" style="margin-top:8px;">${allTags.length? allTags.map(t=>`
    <label><input type="checkbox" value="${escapeHtml(t)}" ${bankTagFilter.has(t)?'checked':''}> ${escapeHtml(t)}</label>
  `).join('') : '<span class="hint">No tags yet</span>'}</div>`;
  content.querySelector('#tagFilterBtn').addEventListener('click', ()=>{
    panel.style.display = panel.style.display==='none' ? 'block' : 'none';
  });
  panel.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      if(inp.checked) bankTagFilter.add(inp.value); else bankTagFilter.delete(inp.value);
      renderBankTab(subject, allTags);
      content.querySelector('#tagFilterPanel').style.display='block';
    });
  });
  content.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click', ()=>openEditModal(subject.id, b.dataset.edit)));
  content.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', ()=>{
    confirmModal('Delete this question? This cannot be undone.', ()=>{
      deleteQuestion(subject.id, b.dataset.del);
    });
  }));
  content.querySelectorAll('[data-preview-group]').forEach(b=>b.addEventListener('click', ()=>{
    openGroupPreviewModal(subject.id, b.dataset.previewGroup);
  }));
}

function openGroupPreviewModal(subjectId, groupId){
  const subject = state.subjects[subjectId];
  const group = subject.groups.find(g=>g.id===groupId);
  if(!group){ toast('This group no longer exists.', 'error'); return; }
  const siblings = group.childQuestionIds.map(id=>subject.questions.find(q=>q.id===id)).filter(Boolean);
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="overlay" id="gpOverlay">
      <div class="modal wide">
        <div class="modal-head"><h3>Group Preview <span style="color:var(--text-faint); font-weight:500;">· ${siblings.length} question${siblings.length!==1?'s':''}</span></h3><button id="gpClose"><i class="fa-solid fa-xmark"></i></button></div>
        <div class="modal-body">
          <div class="quiz-stimulus" style="max-height:200px; margin-bottom:16px;">${group.stimulus ? renderRichText(group.stimulus) : '(No stimulus text)'}</div>
          <div class="review-list">
            ${siblings.map((q,i)=>`
              <div class="review-item">
                <div class="rq-text">${i+1}. ${renderRichText(q.questionText)}</div>
                <div style="margin-bottom:8px;">${(q.tags||[]).map(t=>`<span class="pill">${escapeHtml(t)}</span>`).join('')}</div>
                <div class="rq-ans right"><span class="lbl">Correct answer:</span>${renderRichText(q.options[q.correctAnswerIndex])}</div>
                <div style="margin-top:10px;"><button class="btn ghost" data-gp-edit="${q.id}"><i class="fa-solid fa-pen"></i> Edit</button></div>
              </div>
            `).join('')}
          </div>
        </div>
      </div>
    </div>`;
  renderMath(root);
  const close = ()=>{ root.innerHTML=''; };
  root.querySelector('#gpClose').addEventListener('click', close);
  root.querySelector('#gpOverlay').addEventListener('click', (e)=>{ if(e.target.id==='gpOverlay') close(); });
  root.querySelectorAll('[data-gp-edit]').forEach(b=>b.addEventListener('click', ()=>{
    close();
    openEditModal(subjectId, b.dataset.gpEdit);
  }));
}

let statsSortKey = 'priority';
let statsSortDir = 'desc';
function renderStatsTab(subject){
  const content = document.getElementById('tabContent');
  const qs = filteredQuestions(subject);

  // ---- Overview strip ----
  const totalQuestions = qs.length;
  let totalShown=0, totalCorrect=0, notStarted=0;
  qs.forEach(q=>{
    const t = q.tracking || {timesShown:0,timesCorrect:0,timesWrong:0};
    totalShown += t.timesShown;
    totalCorrect += t.timesCorrect;
    if(t.timesShown===0) notStarted++;
  });
  const overallPct = totalShown>0 ? Math.round((totalCorrect/totalShown)*100) : null;

  // ---- Mastery breakdown ----
  let mNotStarted=0, mNeedsWork=0, mGettingThere=0, mMastered=0;
  qs.forEach(q=>{
    const t = q.tracking || {timesShown:0,timesCorrect:0,timesWrong:0};
    if(t.timesShown===0){ mNotStarted++; return; }
    const pct = (t.timesCorrect/t.timesShown)*100;
    if(pct < 50) mNeedsWork++;
    else if(pct < 75) mGettingThere++;
    else mMastered++;
  });
  const masteryTotal = Math.max(1, totalQuestions);
  const seg = (n)=> (n/masteryTotal*100).toFixed(2)+'%';

  // ---- Sortable table rows ----
  const rows = qs.map(q=>{
    const t = q.tracking || {timesShown:0,timesCorrect:0,timesWrong:0};
    const pct = t.timesShown ? (t.timesCorrect/t.timesShown)*100 : null;
    const priority = computePriority(t);
    return {q, t, pct, priority};
  });
  const sortExtractors = {
    question: r=> r.q.questionText.toLowerCase(),
    shown: r=> r.t.timesShown,
    correct: r=> r.t.timesCorrect,
    pct: r=> r.pct===null ? -1 : r.pct,
    priority: r=> r.priority
  };
  const extractor = sortExtractors[statsSortKey] || sortExtractors.priority;
  rows.sort((a,b)=>{
    const av = extractor(a), bv = extractor(b);
    let cmp = av < bv ? -1 : av > bv ? 1 : 0;
    return statsSortDir === 'asc' ? cmp : -cmp;
  });
  function thAttrs(key){
    const active = statsSortKey === key;
    const arrow = active ? (statsSortDir==='asc' ? '▲' : '▼') : '▾';
    return {cls: 'sortable' + (active?' active':''), arrow};
  }
  const thQ = thAttrs('question'), thShown = thAttrs('shown'), thCorrect = thAttrs('correct'), thPct = thAttrs('pct'), thPri = thAttrs('priority');

  content.innerHTML = `
    <div class="toolbar">
      <button class="btn danger" id="resetHistoryBtn"><i class="fa-solid fa-rotate-left"></i> Reset History</button>
    </div>

    <div class="stat-strip">
      <div class="stat-card"><div class="stat-value">${totalQuestions}</div><div class="stat-label">Question${totalQuestions!==1?'s':''}</div></div>
      <div class="stat-card"><div class="stat-value">${totalShown}</div><div class="stat-label">Total attempts</div></div>
      <div class="stat-card"><div class="stat-value">${overallPct===null?'—':overallPct+'%'}</div><div class="stat-label">Overall accuracy</div></div>
      <div class="stat-card"><div class="stat-value">${notStarted}</div><div class="stat-label">Not yet practiced</div></div>
    </div>

    ${totalQuestions>0 ? `
    <div class="mastery-block">
      <div class="stats-section-title">Mastery breakdown</div>
      <div class="mastery-bar">
        ${mNotStarted?`<div class="mastery-seg notstarted" style="width:${seg(mNotStarted)};" title="Not started: ${mNotStarted}"></div>`:''}
        ${mNeedsWork?`<div class="mastery-seg needswork" style="width:${seg(mNeedsWork)};" title="Needs work: ${mNeedsWork}"></div>`:''}
        ${mGettingThere?`<div class="mastery-seg gettingthere" style="width:${seg(mGettingThere)};" title="Getting there: ${mGettingThere}"></div>`:''}
        ${mMastered?`<div class="mastery-seg mastered" style="width:${seg(mMastered)};" title="Mastered: ${mMastered}"></div>`:''}
      </div>
      <div class="mastery-legend">
        <span><span class="dot notstarted"></span>Not started (${mNotStarted})</span>
        <span><span class="dot needswork"></span>Needs work &lt;50% (${mNeedsWork})</span>
        <span><span class="dot gettingthere"></span>Getting there 50–74% (${mGettingThere})</span>
        <span><span class="dot mastered"></span>Mastered 75%+ (${mMastered})</span>
      </div>
    </div>` : ''}

    <div class="table-scroll">
    <table>
      <thead><tr>
        <th class="${thQ.cls}" data-sort="question">Question <span class="sort-arrow">${thQ.arrow}</span></th>
        <th style="width:160px;">Tags</th>
        <th class="${thShown.cls}" data-sort="shown" style="width:90px;">Shown <span class="sort-arrow">${thShown.arrow}</span></th>
        <th class="${thCorrect.cls}" data-sort="correct" style="width:100px;">Correct/Wrong <span class="sort-arrow">${thCorrect.arrow}</span></th>
        <th class="${thPct.cls}" data-sort="pct" style="width:80px;">% Correct <span class="sort-arrow">${thPct.arrow}</span></th>
        <th class="${thPri.cls}" data-sort="priority" style="width:100px;">Priority <span class="sort-arrow">${thPri.arrow}</span></th>
      </tr></thead>
      <tbody>
        ${rows.map(({q,t,pct,priority})=>{
          const pctClass = pct===null ? '' : (pct>=75?'pct-good':pct>=50?'pct-mid':'pct-bad');
          return `<tr>
            <td class="qprev">${escapeHtml(truncate(q.questionText,80))}</td>
            <td>${(q.tags||[]).map(x=>`<span class="pill">${escapeHtml(x)}</span>`).join('')}</td>
            <td>${t.timesShown}</td>
            <td>${t.timesCorrect}/${t.timesWrong}</td>
            <td class="${pctClass}">${pct===null?'—':Math.round(pct)+'%'}</td>
            <td>${priority.toFixed(1)}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
    </div>
  `;
  content.querySelectorAll('th.sortable').forEach(th=>{
    th.addEventListener('click', ()=>{
      const key = th.dataset.sort;
      if(statsSortKey === key){
        statsSortDir = statsSortDir === 'asc' ? 'desc' : 'asc';
      } else {
        statsSortKey = key;
        statsSortDir = key === 'question' ? 'asc' : 'desc';
      }
      renderStatsTab(subject);
    });
  });
  content.querySelector('#resetHistoryBtn').addEventListener('click', ()=>{
    confirmModal('This will reset all tracking data (times shown, correct, wrong) for this subject. Proceed?', ()=>{
      subject.questions.forEach(q=>{ q.tracking = {timesShown:0,timesCorrect:0,timesWrong:0,lastSeen:null}; });
      touchSubject(subject.id); saveState(); renderMain();
      toast('History reset.', 'success');
    });
  });
}
function computePriority(t){
  const rate = t.timesShown ? t.timesCorrect/t.timesShown : 0;
  const seenFactor = Math.max(0, 5 - t.timesShown);
  return (1-rate)*100 + seenFactor*10;
}

function truncate(str, n){ if(!str) return ''; return str.length>n ? str.slice(0,n)+'…' : str; }
function escapeHtml(str){
  if(str===undefined||str===null) return '';
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* Renders ```block``` and `inline` code spans as real <pre>/<code> elements.
   Everything else is HTML-escaped as plain text (with newlines as <br>). */
function renderRichText(str){
  if(str===undefined||str===null) return '';
  const raw = String(str);
  const blockParts = raw.split(/```([\s\S]*?)```/g);
  let html = '';
  blockParts.forEach((part, i)=>{
    if(i % 2 === 1){
      html += `<pre><code>${escapeHtml(part.replace(/^\n/,'').replace(/\n$/,''))}</code></pre>`;
    } else {
      const inlineParts = part.split(/`([^`\n]+?)`/g);
      inlineParts.forEach((seg, j)=>{
        if(j % 2 === 1){
          html += `<code>${escapeHtml(seg)}</code>`;
        } else {
          html += escapeHtml(seg).replace(/\n/g, '<br>');
        }
      });
    }
  });
  return html;
}

function deleteQuestion(subjectId, qId){
  const subject = state.subjects[subjectId];
  const q = subject.questions.find(x=>x.id===qId);
  if(!q) return;
  subject.questions = subject.questions.filter(x=>x.id!==qId);
  if(q.groupId){
    const group = subject.groups.find(g=>g.id===q.groupId);
    if(group){
      group.childQuestionIds = group.childQuestionIds.filter(id=>id!==qId);
      if(group.childQuestionIds.length===0){
        subject.groups = subject.groups.filter(g=>g.id!==group.id);
      }
    }
  }
  touchSubject(subjectId);
  saveState(); renderMain();
  toast('Question deleted.', 'success');
}

function parseImportText(text, subjectId){
  const subject = state.subjects[subjectId];
  const blocks = text.split(/^---\s*$/m).map(b=>b.trim()).filter(Boolean);
  let added = 0, skipped = 0;
  let currentGroup = null; // {id, stimulus} while consuming implicit children

  for(const block of blocks){
    const fields = parseFields(block);
    const hasType = 'type' in fields;
    const explicitType = hasType ? fields.type.trim().toLowerCase() : null;

    if(explicitType === 'group'){
      // validate & create new group
      if(!fields.question || !fields.options || !('answer' in fields)){ skipped++; currentGroup=null; continue; }
      const options = fields.options.split('|').map(o=>o.trim()).filter(Boolean);
      const answerIdx = parseInt(fields.answer);
      if(options.length<2 || options.length>5 || isNaN(answerIdx) || answerIdx<0 || answerIdx>=options.length){ skipped++; currentGroup=null; continue; }
      const groupId = uid('group');
      const stimulus = fields.stimulus || '';
      const group = { id: groupId, stimulus, childQuestionIds: [] };
      subject.groups.push(group);
      const childId = uid('q');
      const q = {
        id: childId, type:'group_child', groupId, parentStimulus: stimulus,
        questionText: fields.question, options, correctAnswerIndex: answerIdx,
        tags: (fields.tags||'').split(';').map(t=>t.trim()).filter(Boolean),
        tracking: {timesShown:0,timesCorrect:0,timesWrong:0,lastSeen:null}
      };
      subject.questions.push(q);
      group.childQuestionIds.push(childId);
      currentGroup = group;
      added++;
    } else if(explicitType === 'single'){
      currentGroup = null;
      if(!fields.question || !fields.options || !('answer' in fields)){ skipped++; continue; }
      const options = fields.options.split('|').map(o=>o.trim()).filter(Boolean);
      const answerIdx = parseInt(fields.answer);
      if(options.length<2 || options.length>5 || isNaN(answerIdx) || answerIdx<0 || answerIdx>=options.length){ skipped++; continue; }
      const q = {
        id: uid('q'), type:'single', groupId:null, parentStimulus:null,
        questionText: fields.question, options, correctAnswerIndex: answerIdx,
        tags: (fields.tags||'').split(';').map(t=>t.trim()).filter(Boolean),
        tracking: {timesShown:0,timesCorrect:0,timesWrong:0,lastSeen:null}
      };
      subject.questions.push(q);
      added++;
    } else {
      // no Type: declaration -> implicit child of currentGroup, if any
      if(!currentGroup){ skipped++; continue; }
      if(!fields.question || !fields.options || !('answer' in fields)){ skipped++; continue; }
      const options = fields.options.split('|').map(o=>o.trim()).filter(Boolean);
      const answerIdx = parseInt(fields.answer);
      if(options.length<2 || options.length>5 || isNaN(answerIdx) || answerIdx<0 || answerIdx>=options.length){ skipped++; continue; }
      const childId = uid('q');
      const q = {
        id: childId, type:'group_child', groupId: currentGroup.id, parentStimulus: currentGroup.stimulus,
        questionText: fields.question, options, correctAnswerIndex: answerIdx,
        tags: (fields.tags||'').split(';').map(t=>t.trim()).filter(Boolean),
        tracking: {timesShown:0,timesCorrect:0,timesWrong:0,lastSeen:null}
      };
      subject.questions.push(q);
      currentGroup.childQuestionIds.push(childId);
      added++;
    }
  }
  return {added, skipped};
}
function parseFields(block){
  const fields = {};
  const lines = block.split('\n');
  let curKey = null;
  let inFence = false;
  for(const line of lines){
    if(/^\s*```/.test(line)){
      inFence = !inFence;
      if(curKey) fields[curKey] += '\n' + line;
      continue;
    }
    if(inFence){
      if(curKey) fields[curKey] += '\n' + line;
      continue;
    }
    const m = line.match(/^([A-Za-z]+)\s*:\s*(.*)$/);
    if(m){
      curKey = m[1].trim().toLowerCase();
      fields[curKey] = m[2];
    } else if(curKey){
      fields[curKey] += '\n' + line;
    }
  }
  return fields;
}

function exportQuizPack(selectedIds, stripProgress){
  const exportSubjects = {};
  selectedIds.forEach(id=>{
    const s = state.subjects[id];
    if(!s) return;
    const clonedQuestions = s.questions.map(q=>{
      const clone = Object.assign({}, q, {tags:(q.tags||[]).slice(), options:(q.options||[]).slice()});
      clone.tracking = stripProgress ? freshTracking() : Object.assign({}, q.tracking || freshTracking());
      return clone;
    });
    const clonedGroups = s.groups.map(g=> Object.assign({}, g, {childQuestionIds:(g.childQuestionIds||[]).slice()}));
    exportSubjects[id] = Object.assign({}, s, {questions: clonedQuestions, groups: clonedGroups});
  });
  const exportData = {subjects: exportSubjects, version: state.version || '1.0'};

  const blob = new Blob([JSON.stringify(exportData, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const subjectCount = selectedIds.length;
  const namePart = subjectCount===1 ? slugify(state.subjects[selectedIds[0]].name) : (subjectCount===Object.keys(state.subjects).length ? 'all' : subjectCount+'-courses');
  a.href = url; a.download = `quiz-pack-${namePart}-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast(`Quiz Pack exported — ${subjectCount} course${subjectCount!==1?'s':''}${stripProgress?', progress left out':''}.`, 'success');
}
function slugify(str){
  return String(str).trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40) || 'course';
}

/* Normalizes text for comparison only (trim, collapse whitespace, lowercase). */
function normalizeText(s){ return (s||'').trim().replace(/\s+/g,' ').toLowerCase(); }

/* A content-based identity for a question, since imported IDs won't line up
   across different browsers/devices. Two questions are "the same" if their
   text, options, correct answer, and (for group children) stimulus all match. */
function fingerprintQuestion(q){
  const stim = q.type === 'group_child' ? normalizeText(q.parentStimulus) : '';
  const qt = normalizeText(q.questionText);
  const opts = (q.options||[]).map(o=>normalizeText(o)).join('|');
  return stim + '::' + qt + '::' + opts + '::' + q.correctAnswerIndex;
}

function freshTracking(){
  return {timesShown:0, timesCorrect:0, timesWrong:0, lastSeen:null};
}
function trackingFrom(q, policy){
  if((policy === 'keep-imported' || policy === 'smart-auto') && q.tracking){
    return {
      timesShown: q.tracking.timesShown||0,
      timesCorrect: q.tracking.timesCorrect||0,
      timesWrong: q.tracking.timesWrong||0,
      lastSeen: q.tracking.lastSeen||null
    };
  }
  return freshTracking();
}

function mergeImportedState(incomingData, policy){
  const report = {subjectsAdded:0, questionsAdded:0, questionsMatched:0};
  const incomingSubjects = Object.values(incomingData.subjects || {});

  incomingSubjects.forEach(incomingSubject=>{
    const nameKey = normalizeText(incomingSubject.name);
    let localSubject = Object.values(state.subjects).find(s=> normalizeText(s.name) === nameKey);
    if(!localSubject){
      localSubject = {id: uid('subject'), name: incomingSubject.name, questions:[], groups:[], updatedAt: new Date().toISOString()};
      state.subjects[localSubject.id] = localSubject;
      report.subjectsAdded++;
    }

    const localFingerprints = new Map();
    localSubject.questions.forEach(q=> localFingerprints.set(fingerprintQuestion(q), q));
    const localGroupByStimulus = new Map();
    localSubject.groups.forEach(g=> localGroupByStimulus.set(normalizeText(g.stimulus), g));

    (incomingSubject.questions||[]).forEach(incomingQ=>{
      const fp = fingerprintQuestion(incomingQ);
      const existing = localFingerprints.get(fp);
      if(existing){
        if(policy === 'keep-imported'){
          existing.tracking = trackingFrom(incomingQ, 'keep-imported');
        } else if(policy === 'reset-all'){
          existing.tracking = freshTracking();
        } else if(policy === 'smart-auto'){
          // Automatic background sync: whichever side has more attempts logged
          // is treated as the more current copy of this question's progress.
          const remoteT = incomingQ.tracking || freshTracking();
          const localT = existing.tracking || freshTracking();
          if((remoteT.timesShown||0) > (localT.timesShown||0)){
            existing.tracking = trackingFrom(incomingQ, 'keep-imported');
          }
        }
        // 'reset-new' leaves existing local progress untouched
        report.questionsMatched++;
      } else {
        const newId = uid('q');
        let groupId = null, parentStimulus = null;
        if(incomingQ.type === 'group_child'){
          const stimKey = normalizeText(incomingQ.parentStimulus);
          let localGroup = localGroupByStimulus.get(stimKey);
          if(!localGroup){
            localGroup = {id: uid('group'), stimulus: incomingQ.parentStimulus, childQuestionIds:[]};
            localSubject.groups.push(localGroup);
            localGroupByStimulus.set(stimKey, localGroup);
          }
          groupId = localGroup.id;
          parentStimulus = incomingQ.parentStimulus;
          localGroup.childQuestionIds.push(newId);
        }
        const clone = {
          id: newId,
          type: incomingQ.type,
          groupId,
          parentStimulus,
          questionText: incomingQ.questionText,
          options: (incomingQ.options||[]).slice(),
          correctAnswerIndex: incomingQ.correctAnswerIndex,
          tags: (incomingQ.tags||[]).slice(),
          tracking: policy === 'reset-all' ? freshTracking() : trackingFrom(incomingQ, policy)
        };
        localSubject.questions.push(clone);
        localFingerprints.set(fp, clone);
        report.questionsAdded++;
      }
    });

    localSubject.updatedAt = new Date().toISOString();
  });

  return report;
}

/* ============================= CLOUD SYNC (Firebase) ============================= */
const SYNC_COLLECTION = 'quizHubUsers';
const PULL_INTERVAL_MS = 2 * 60 * 1000; // periodic pull every 2 minutes
const PUSH_DEBOUNCE_MS = 3000;

// This app's own Firebase project — baked in so new devices/visitors don't need
// to paste a config just to sign in. It only identifies which project to talk to;
// it is not a secret (see the Firestore security rules shown in the Sync panel,
// which are what actually keep everyone's data private to their own account).
const DEFAULT_FIREBASE_CONFIG = {
  apiKey: "AIzaSyBRIrd9hQCPXCjAabzq2KwkEqdg1lv_QHI",
  authDomain: "leiu-quiz-hub.firebaseapp.com",
  projectId: "leiu-quiz-hub",
  storageBucket: "leiu-quiz-hub.firebasestorage.app",
  messagingSenderId: "875140204038",
  appId: "1:875140204038:web:871b4b710112fb96572587",
  measurementId: "G-3FJLWDPV5X"
};

let firebaseApp = null, firebaseAuth = null, firestoreDb = null, currentUser = null;
let syncStatus = 'offline'; // offline | signed-out | syncing | synced | error
let lastSyncedAt = null;
let lastSyncError = '';
let pushDebounceTimer = null;
let periodicPullTimer = null;
let firebaseLoadRetries = 0;

function getFirebaseConfig(){
  return DEFAULT_FIREBASE_CONFIG;
}
function initFirebaseIfConfigured(){
  const cfg = getFirebaseConfig();
  if(!cfg){ syncStatus = 'offline'; updateSyncIndicator(); return; }
  if(typeof firebase === 'undefined'){
    firebaseLoadRetries++;
    if(firebaseLoadRetries > 20){ syncStatus = 'error'; lastSyncError = 'Could not load the sync library (check your internet connection).'; updateSyncIndicator(); return; }
    setTimeout(initFirebaseIfConfigured, 500);
    return;
  }
  if(firebaseApp) return;
  try{
    firebaseApp = firebase.initializeApp(cfg);
    firebaseAuth = firebase.auth();
    // Some mobile browsers (notably Safari private mode, or with strict tracking
    // protections) block IndexedDB, which LOCAL persistence needs — without a
    // fallback the SDK can fail silently and sign-in never completes. Degrade
    // gracefully instead of leaving the user stuck with no feedback.
    firebaseAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
      .catch(()=> firebaseAuth.setPersistence(firebase.auth.Auth.Persistence.SESSION))
      .catch(()=> firebaseAuth.setPersistence(firebase.auth.Auth.Persistence.NONE))
      .catch(()=>{});
    firestoreDb = firebase.firestore();
    firebaseAuth.onAuthStateChanged(user=>{
      currentUser = user;
      if(user){
        syncStatus = 'synced';
        startPeriodicPull();
        pullAndMergeFromCloud();
      } else {
        syncStatus = 'signed-out';
        stopPeriodicPull();
      }
      updateSyncIndicator();
    });
  }catch(e){
    syncStatus = 'error';
    lastSyncError = e.message;
    updateSyncIndicator();
    toast('Cloud sync failed to start: ' + e.message, 'error');
  }
}

async function cloudSignUp(email, password){
  return firebaseAuth.createUserWithEmailAndPassword(email, password);
}
async function cloudLogIn(email, password){
  return firebaseAuth.signInWithEmailAndPassword(email, password);
}
async function cloudSignOut(){
  await firebaseAuth.signOut();
}

function scheduleCloudPush(){
  if(!currentUser || !firestoreDb) return;
  clearTimeout(pushDebounceTimer);
  pushDebounceTimer = setTimeout(pushToCloud, PUSH_DEBOUNCE_MS);
}

async function pushToCloud(){
  if(!currentUser || !firestoreDb) return;
  const json = JSON.stringify(state);
  const sizeMB = new Blob([json]).size / (1024*1024);
  if(sizeMB > 0.9){
    syncStatus = 'error';
    lastSyncError = 'Your data (' + sizeMB.toFixed(1) + 'MB) is too large for cloud sync (1MB limit). Try exporting a smaller Quiz Pack per course instead.';
    updateSyncIndicator();
    return;
  }
  syncStatus = 'syncing'; updateSyncIndicator();
  try{
    await firestoreDb.collection(SYNC_COLLECTION).doc(currentUser.uid).set({
      stateJson: json,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    lastSyncedAt = new Date();
    syncStatus = 'synced';
  }catch(e){
    syncStatus = 'error';
    lastSyncError = e.message;
  }
  updateSyncIndicator();
}

async function pullAndMergeFromCloud(silent=true){
  if(!currentUser || !firestoreDb) return;
  syncStatus = 'syncing'; updateSyncIndicator();
  try{
    const doc = await firestoreDb.collection(SYNC_COLLECTION).doc(currentUser.uid).get();
    if(doc.exists && doc.data().stateJson){
      const remote = JSON.parse(doc.data().stateJson);
      const report = mergeImportedState(remote, 'smart-auto');
      if(report.subjectsAdded || report.questionsAdded){
        saveState(); renderAll();
        if(!silent) toast(`Synced: ${report.subjectsAdded} new course(s), ${report.questionsAdded} new question(s).`, 'success');
      } else if(!silent){
        toast('Already up to date.', 'success');
      }
    } else if(!silent){
      toast('Nothing in the cloud yet — this device will push first.', 'success');
    }
    lastSyncedAt = new Date();
    syncStatus = 'synced';
    updateSyncIndicator();
    scheduleCloudPush(); // push back in case local had things the cloud was missing
  }catch(e){
    syncStatus = 'error';
    lastSyncError = e.message;
    updateSyncIndicator();
  }
}

function startPeriodicPull(){
  stopPeriodicPull();
  periodicPullTimer = setInterval(()=> pullAndMergeFromCloud(true), PULL_INTERVAL_MS);
}
function stopPeriodicPull(){
  if(periodicPullTimer) clearInterval(periodicPullTimer);
  periodicPullTimer = null;
}

function timeAgo(date){
  if(!date) return '';
  const secs = Math.floor((Date.now() - date.getTime())/1000);
  if(secs < 10) return 'just now';
  if(secs < 60) return secs + 's ago';
  const mins = Math.floor(secs/60);
  if(mins < 60) return mins + 'm ago';
  const hrs = Math.floor(mins/60);
  return hrs + 'h ago';
}

function updateSyncIndicator(){
  const btn = document.getElementById('btnSync');
  if(!btn) return;
  const dot = btn.querySelector('.sync-dot');
  if(dot) dot.className = 'sync-dot ' + syncStatus;
  const labels = {
    offline: 'Cloud sync not set up — click to enable',
    'signed-out': 'Cloud sync ready — click to sign in',
    syncing: 'Syncing…',
    synced: 'Synced' + (lastSyncedAt ? ' ' + timeAgo(lastSyncedAt) : ''),
    error: 'Sync error — click for details'
  };
  btn.title = labels[syncStatus] || 'Cloud sync';
  const openPanel = document.getElementById('syncPanelRoot');
  if(openPanel) renderSyncModalBody();
}
