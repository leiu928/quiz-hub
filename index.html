            <select class="select-input" id="gqSubject" style="width:100%;">
              ${subjects.map(s=>`<option value="${s.id}" ${s.id===defaultSubjectId?'selected':''}>${escapeHtml(s.name)}</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>Number of items</label>
            <input type="number" id="gqCount" value="10" min="1">
          </div>
          <div class="field"><label>Tags</label>
            <div class="tagdrop" id="gqTagDrop">
              <button type="button" class="tagdrop-btn" id="gqTagDropBtn">
                <span class="preview" id="gqTagPreview">All tags</span>
                <i class="fa-solid fa-chevron-down" style="font-size:11px; color:var(--text-faint);"></i>
              </button>
            </div>
            <div class="radio-row" style="margin-top:8px;">
              <label><input type="radio" name="gqMatch" value="or" checked> Match ANY (OR)</label>
              <label><input type="radio" name="gqMatch" value="and"> Match ALL (AND)</label>
            </div>
          </div>
          <div class="field"><label>Mode</label>
            <div class="radio-row">
              <label><input type="radio" name="gqMode" value="practice" checked> Practice (instant feedback)</label>
              <label><input type="radio" name="gqMode" value="exam"> Exam (score at end)</label>
            </div>
          </div>
        </div>
        <div class="modal-foot">
          <button class="btn ghost" id="gqCancel">Cancel</button>
          <button class="btn primary" id="gqStart">Start Quiz</button>
        </div>
      </div>
    </div>`;
  const close = ()=>{ root.innerHTML=''; };
  let gqSelectedTags = new Set();
  function updateTagPreview(){
    const preview = root.querySelector('#gqTagPreview');
    if(gqSelectedTags.size===0){ preview.textContent = 'All tags'; preview.classList.remove('has-selection'); }
    else{
      preview.textContent = Array.from(gqSelectedTags).join(', ');
      preview.classList.add('has-selection');
    }
  }
  function refreshTags(){
    gqSelectedTags = new Set();
    updateTagPreview();
    const dropWrap = root.querySelector('#gqTagDrop');
    const existingPanel = dropWrap.querySelector('.tagdrop-panel');
    if(existingPanel) existingPanel.remove();
  }
  function openTagPanel(){
    const dropWrap = root.querySelector('#gqTagDrop');
    let panel = dropWrap.querySelector('.tagdrop-panel');
    if(panel){ panel.remove(); return; }
    const subj = state.subjects[root.querySelector('#gqSubject').value];
    const tags = getAllTags(subj);
    panel = document.createElement('div');
    panel.className = 'tagdrop-panel';
    panel.innerHTML = `
      <input type="text" class="tagdrop-search" placeholder="Type to filter tags…" autocomplete="off">
      <div class="tagdrop-list"></div>
    `;
    dropWrap.appendChild(panel);
    const searchInput = panel.querySelector('.tagdrop-search');
    const listWrap = panel.querySelector('.tagdrop-list');
    function renderList(filterStr){
      const f = filterStr.trim().toLowerCase();
      const visible = f ? tags.filter(t=>t.toLowerCase().includes(f)) : tags;
      listWrap.innerHTML = visible.length ? visible.map(t=>`
        <label><input type="checkbox" value="${escapeHtml(t)}" ${gqSelectedTags.has(t)?'checked':''}> ${escapeHtml(t)}</label>
      `).join('') : `<span class="hint">${tags.length ? 'No matching tags' : 'No tags in this subject'}</span>`;
      listWrap.querySelectorAll('input').forEach(inp=>{
        inp.addEventListener('change', ()=>{
          if(inp.checked) gqSelectedTags.add(inp.value); else gqSelectedTags.delete(inp.value);
          updateTagPreview();
        });
      });
    }
    renderList('');
    searchInput.addEventListener('input', ()=> renderList(searchInput.value));
    setTimeout(()=> searchInput.focus(), 0);
  }
  refreshTags();
  root.querySelector('#gqTagDropBtn').addEventListener('click', (e)=>{ e.stopPropagation(); openTagPanel(); });
  document.addEventListener('click', function outsideTagClick(e){
    const dropWrap = root.querySelector('#gqTagDrop');
    if(!dropWrap) { document.removeEventListener('click', outsideTagClick); return; }
    if(!dropWrap.contains(e.target)){ const p = dropWrap.querySelector('.tagdrop-panel'); if(p) p.remove(); }
  });
  root.querySelector('#gqSubject').addEventListener('change', refreshTags);
  root.querySelector('#genQClose').addEventListener('click', close);
  root.querySelector('#gqCancel').addEventListener('click', close);
  root.querySelector('#genQOverlay').addEventListener('click', (e)=>{ if(e.target.id==='genQOverlay') close(); });
  root.querySelector('#gqStart').addEventListener('click', ()=>{
    const subjectId = root.querySelector('#gqSubject').value;
    const count = parseInt(root.querySelector('#gqCount').value);
    const selectedTags = Array.from(gqSelectedTags);
    const matchMode = root.querySelector('input[name=gqMatch]:checked').value;
    const mode = root.querySelector('input[name=gqMode]:checked').value;
    if(!count || count<1){ toast('Enter a valid number of items.', 'error'); return; }
    const result = generateQuiz(subjectId, count, selectedTags, matchMode);
    if(result.error){ toast(result.error, 'error'); return; }
    close();
    startQuiz(subjectId, result.quiz, mode);
  });
}

function generateQuiz(subjectId, desiredCount, selectedTags, matchMode){
  const subject = state.subjects[subjectId];
  let pool = subject.questions.slice();
  if(selectedTags.length>0){
    pool = pool.filter(q=>{
      const qtags = q.tags||[];
      return matchMode==='and' ? selectedTags.every(t=>qtags.includes(t)) : selectedTags.some(t=>qtags.includes(t));
    });
  }
  if(pool.length < desiredCount){
    return {error: `Insufficient questions. Pool has ${pool.length} item(s), but you requested ${desiredCount}. Please reduce the number or add more questions.`};
  }
  // Fisher-Yates shuffle
  const shuffled = pool.slice();
  for(let i=shuffled.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  const finalQuiz = [];
  const usedGroups = new Set();
  for(const q of shuffled){
    if(finalQuiz.length >= desiredCount) break;
    if(q.type === 'single'){
      finalQuiz.push(q);
    } else if(q.type === 'group_child'){
      if(usedGroups.has(q.groupId)) continue;
      const siblings = pool.filter(x=>x.type==='group_child' && x.groupId===q.groupId);
      const shuffledSibs = siblings.slice();
      for(let i=shuffledSibs.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [shuffledSibs[i], shuffledSibs[j]] = [shuffledSibs[j], shuffledSibs[i]];
      }
      const takeCount = Math.min(3, shuffledSibs.length);
      const taken = shuffledSibs.slice(0, takeCount);
      finalQuiz.push(...taken);
      usedGroups.add(q.groupId);
    }
  }
  // trim to exactly desiredCount is NOT forced per spec (group activation may exceed slightly);
  // we keep as built per algorithm (loop breaks once >= desiredCount at top of next iteration)

  // Randomize option order per question
  const finalized = finalQuiz.map(q=>{
    const idxs = q.options.map((_,i)=>i);
    for(let i=idxs.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [idxs[i], idxs[j]] = [idxs[j], idxs[i]];
    }
    const newOptions = idxs.map(i=>q.options[i]);
    const newCorrect = idxs.indexOf(q.correctAnswerIndex);
    return Object.assign({}, q, {options:newOptions, correctAnswerIndex:newCorrect, sourceId:q.id});
  });
  return {quiz: finalized};
}

/* ============================= QUIZ RUNTIME ============================= */
let quizState = null;
function startQuiz(subjectId, quizArr, mode){
  quizState = {
    subjectId, mode, items: quizArr, index: 0,
    answers: new Array(quizArr.length).fill(null),
    checked: new Array(quizArr.length).fill(false),
    startedAt: new Date().toISOString()
  };
  persistQuizState();
  renderQuizOverlay();
}
function persistQuizState(){
  try{ sessionStorage.setItem(SESSION_KEY, JSON.stringify(quizState)); }catch(e){}
}
function clearQuizSession(){
  sessionStorage.removeItem(SESSION_KEY);
}

function renderQuizOverlay(animate=true){
  const root = document.getElementById('modalRoot');
  const q = quizState.items[quizState.index];
  const total = quizState.items.length;
  const pct = Math.round(((quizState.index)/total)*100);
  const isLast = quizState.index === total-1;
  const selected = quizState.answers[quizState.index];
  const checked = quizState.checked[quizState.index];

  const optionsHtml = (q.options||[]).map((opt,i)=>{
    let cls = 'quiz-option';
    if(quizState.mode==='practice' && checked){
      if(i===q.correctAnswerIndex) cls += ' correct';
      else if(i===selected) cls += ' incorrect';
    } else if(selected===i){
      cls += ' selected';
    }
    return `<div class="${cls}" data-opt="${i}"><div class="marker"></div><div>${renderRichText(opt)}</div><span class="opt-key">${i+1}</span></div>`;
  }).join('');

  const showCheck = quizState.mode==='practice' && !checked;
  const showNext = quizState.mode==='exam' || (quizState.mode==='practice' && checked);

  const actionsBlock = `
    <div class="quiz-actions">
      <button class="btn ghost" id="quizPrev" ${quizState.index===0?'disabled':''}>Previous</button>
      <div style="display:flex; gap:8px;">
        ${showCheck ? `<button class="btn primary" id="quizCheck">Check Answer <span class="key-hint">Enter</span></button>` : ''}
        ${showNext ? `<button class="btn primary" id="quizNext">${isLast ? 'Finish' : 'Next'} <span class="key-hint">Enter</span></button>` : ''}
      </div>
    </div>
  `;

  const questionBlock = `
    <div class="quiz-question">${renderRichText(q.questionText)}</div>
    <div id="quizOptions">${optionsHtml}</div>
    ${quizState.mode==='practice' && checked ? `<div class="quiz-feedback ${selected===q.correctAnswerIndex?'correct':'incorrect'}">${selected===q.correctAnswerIndex?'Correct!':'Not quite — review the highlighted answer.'}</div>` : ''}
    ${actionsBlock}
  `;

  const fadeCls = animate ? ' quiz-fade' : '';
  const content = q.type==='group_child' ? `
    <div class="quiz-split${fadeCls}">
      <div class="quiz-stimulus">${renderRichText(q.parentStimulus||'')}</div>
      <div class="quiz-qside">${questionBlock}</div>
    </div>
  ` : `<div class="quiz-inner${fadeCls}">${questionBlock}</div>`;

  let overlay = root.querySelector('.quiz-overlay');
  if(!overlay){
    root.innerHTML = `
      <div class="quiz-overlay">
        <div class="quiz-top">
          <div>
            <div class="quiz-progress" id="quizProgressText">Question ${quizState.index+1} of ${total}</div>
            <div class="quiz-progress-bar"><div class="quiz-progress-bar-fill" id="quizProgressFill" style="width:${pct}%;"></div></div>
          </div>
          <button class="btn ghost" id="quizExit"><i class="fa-solid fa-xmark"></i> Exit Quiz <span class="key-hint">Esc</span></button>
        </div>
        <div class="quiz-content" id="quizContentWrap">${content}</div>
      </div>`;
  } else {
    overlay.querySelector('#quizProgressText').textContent = `Question ${quizState.index+1} of ${total}`;
    overlay.querySelector('#quizProgressFill').style.width = pct+'%';
    overlay.querySelector('#quizContentWrap').innerHTML = content;
  }

  renderMath(root);

  root.querySelectorAll('[data-opt]').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(quizState.mode==='practice' && quizState.checked[quizState.index]) return;
      quizState.answers[quizState.index] = parseInt(el.dataset.opt);
      renderQuizOverlay(false);
    });
  });
  const checkBtn = root.querySelector('#quizCheck');
  if(checkBtn) checkBtn.addEventListener('click', ()=>{
    if(quizState.answers[quizState.index]===null){ toast('Select an answer first.', 'error'); return; }
    quizState.checked[quizState.index] = true;
    persistQuizState();
    renderQuizOverlay(false);
  });
  root.querySelector('#quizPrev').addEventListener('click', ()=>{
    if(quizState.index>0){ quizState.index--; persistQuizState(); renderQuizOverlay(true); }
  });
  const nextBtn = root.querySelector('#quizNext');
  if(nextBtn) nextBtn.addEventListener('click', ()=>{
    if(isLast){
      finishQuiz();
    } else {
      quizState.index++;
      persistQuizState();
      renderQuizOverlay(true);
    }
  });
  root.querySelector('#quizExit').addEventListener('click', ()=>{
    confirmModal('Progress will be lost. Exit?', ()=>{
      clearQuizSession();
      quizState = null;
      document.getElementById('modalRoot').innerHTML='';
      renderMain();
    });
  });
}

/* ============================= KEYBOARD SHORTCUTS ============================= */
document.addEventListener('keydown', (e)=>{
  const tag = (e.target.tagName || '').toLowerCase();
  const isTyping = tag==='input' || tag==='textarea' || tag==='select' || e.target.isContentEditable;

  // Quiz overlay shortcuts take priority whenever a quiz is active
  const inQuiz = quizState && document.querySelector('.quiz-overlay') && !document.querySelector('.overlay');
  if(inQuiz){
    const idx = quizState.index;
    const q = quizState.items[idx];
    if(e.key >= '1' && e.key <= '5'){
      const optIdx = parseInt(e.key)-1;
      if(optIdx < (q.options||[]).length){
        if(!(quizState.mode==='practice' && quizState.checked[idx])){
          e.preventDefault();
          quizState.answers[idx] = optIdx;
          renderQuizOverlay(false);
        }
      }
    } else if(e.key === 'Enter'){
      e.preventDefault();
      const checkBtn = document.getElementById('quizCheck');
      const nextBtn = document.getElementById('quizNext');
      if(checkBtn) checkBtn.click();
      else if(nextBtn) nextBtn.click();
    } else if(e.key === 'ArrowLeft'){
      e.preventDefault();
      const prevBtn = document.getElementById('quizPrev');
      if(prevBtn && !prevBtn.disabled) prevBtn.click();
    } else if(e.key === 'ArrowRight'){
      const nextBtn = document.getElementById('quizNext');
      if(nextBtn){ e.preventDefault(); nextBtn.click(); }
    } else if(e.key === 'Escape'){
      e.preventDefault();
      document.getElementById('quizExit')?.click();
    }
    return;
  }

  // Any modal open: only Escape is handled generically (close on backdrop already supports click)
  if(document.querySelector('.overlay')){
    if(e.key === 'Escape' && !isTyping){
      const closeBtn = document.querySelector('.modal-head button, #confCancel');
      if(closeBtn) closeBtn.click();
    }
    return;
  }

  if(isTyping) return;

  // Global app shortcuts
  if(e.key === '/'){
    e.preventDefault();
    document.getElementById('searchInput').focus();
  } else if(e.key.toLowerCase() === 'g'){
    openGeneratorModal();
  } else if(e.key.toLowerCase() === 'n'){
    document.getElementById('btnAddSubject').click();
  } else if(e.key.toLowerCase() === 'i'){
    document.getElementById('btnImport').click();
  } else if(e.key.toLowerCase() === 'd'){
    toggleDarkMode();
  }
});

let lastQuizMistakes = [];
function finishQuiz(){
  const subject = state.subjects[quizState.subjectId];
  let correct = 0, wrong = 0;
  lastQuizMistakes = [];
  quizState.items.forEach((item, i)=>{
    const ans = quizState.answers[i];
    const origQ = subject.questions.find(x=>x.id===item.sourceId);
    if(origQ){
      origQ.tracking = origQ.tracking || {timesShown:0,timesCorrect:0,timesWrong:0,lastSeen:null};
      origQ.tracking.timesShown++;
      origQ.tracking.lastSeen = new Date().toISOString();
      if(ans!==null && ans===item.correctAnswerIndex){ origQ.tracking.timesCorrect++; correct++; }
      else { origQ.tracking.timesWrong++; wrong++; }
    }
    if(ans===null || ans!==item.correctAnswerIndex){
      lastQuizMistakes.push({
        stimulus: item.parentStimulus || null,
        questionText: item.questionText,
        yourAnswer: ans!==null ? item.options[ans] : null,
        correctAnswer: item.options[item.correctAnswerIndex]
      });
    }
  });
  touchSubject(quizState.subjectId);
  saveState();
  clearQuizSession();
  renderEndScreen(correct, wrong, quizState.items.length);
}

function renderEndScreen(correct, wrong, total){
  const root = document.getElementById('modalRoot');
  const scorePct = Math.round((correct/total)*100);
  root.innerHTML = `
    <div class="quiz-overlay">
      <div class="quiz-top"><div class="quiz-progress">Quiz Complete</div><div></div></div>
      <div class="quiz-content">
        <div class="end-screen">
          <i class="fa-solid fa-circle-check" style="font-size:40px; color:var(--accent);"></i>
          <div class="end-score">${scorePct}%</div>
          <div style="color:var(--text-secondary); font-size:14px;">${correct} correct, ${wrong} wrong out of ${total}</div>
          <div style="display:flex; gap:8px; margin-top:16px;">
            ${lastQuizMistakes.length ? `<button class="btn" id="quizReviewBtn"><i class="fa-solid fa-magnifying-glass"></i> Review Mistaken Questions</button>` : ''}
            <button class="btn primary" id="quizFinishBtn">Finish</button>
          </div>
        </div>
      </div>
    </div>`;
  renderMath(root);
  const reviewBtn = root.querySelector('#quizReviewBtn');
  if(reviewBtn) reviewBtn.addEventListener('click', ()=> renderReviewScreen(correct, wrong, total));
  root.querySelector('#quizFinishBtn').addEventListener('click', ()=>{
    quizState = null;
    root.innerHTML='';
    renderMain();
  });
}

function renderReviewScreen(correct, wrong, total){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="quiz-overlay">
      <div class="quiz-top">
        <div class="quiz-progress">Mistaken Questions (${lastQuizMistakes.length})</div>
        <button class="btn ghost" id="reviewBack"><i class="fa-solid fa-arrow-left"></i> Back to Summary</button>
      </div>
      <div class="quiz-content">
        <div class="review-list">
          ${lastQuizMistakes.map(m=>`
            <div class="review-item">
              ${m.stimulus ? `<div class="rq-stimulus">${renderRichText(m.stimulus)}</div>` : ''}
              <div class="rq-text">${renderRichText(m.questionText)}</div>
              <div class="rq-ans wrong"><span class="lbl">Your answer:</span>${m.yourAnswer ? renderRichText(m.yourAnswer) : 'No answer'}</div>
              <div class="rq-ans right"><span class="lbl">Correct answer:</span>${renderRichText(m.correctAnswer)}</div>
            </div>
          `).join('')}
        </div>
      </div>
    </div>`;
  renderMath(root);
  root.querySelector('#reviewBack').addEventListener('click', ()=> renderEndScreen(correct, wrong, total));
}

/* ============================= RESUME BOTTOM SHEET ============================= */
function checkResumeQuiz(){
  try{
    const raw = sessionStorage.getItem(SESSION_KEY);
    if(!raw) return;
    const saved = JSON.parse(raw);
    const subject = state.subjects[saved.subjectId];
    if(!subject){ sessionStorage.removeItem(SESSION_KEY); return; }
    // staleness check
    if(subject.updatedAt && saved.startedAt && new Date(subject.updatedAt) > new Date(saved.startedAt)){
      sessionStorage.removeItem(SESSION_KEY);
      return;
    }
    showResumeSheet(saved);
  }catch(e){ sessionStorage.removeItem(SESSION_KEY); }
}
function showResumeSheet(saved){
  const root = document.getElementById('sheetRoot');
  root.innerHTML = `
    <div class="bottom-sheet">
      <span>You have an ongoing quiz. Resume?</span>
      <button class="resume-btn" id="sheetResume">Resume</button>
      <button class="discard-btn" id="sheetDiscard">Discard</button>
    </div>`;
  root.querySelector('#sheetResume').addEventListener('click', ()=>{
    quizState = saved;
    root.innerHTML='';
    renderQuizOverlay();
  });
  root.querySelector('#sheetDiscard').addEventListener('click', ()=>{
    clearQuizSession();
    root.innerHTML='';
  });
}

/* ============================= INIT ============================= */
function init(){
  initDarkMode();
  renderAll();
  checkResumeQuiz();
  initFirebaseIfConfigured();
}
window.addEventListener('load', init);
</script>
